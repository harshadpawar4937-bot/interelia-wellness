# Quality gate for Render autoDeployTrigger: checksPass
# Render deploys main only after these checks succeed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        env:
          ENVIRONMENT: development
          SECRET_KEY: ci-test-secret-key-at-least-32-characters-long
          DATABASE_URL: sqlite:///./ci_test.db
        run: PYTHONPATH=. pytest tests/ -q --tb=line

  frontend-typecheck:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  admin-typecheck:
    name: Admin typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  docker-build:
    name: Docker build (API / store / admin)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: backend
          - name: store
            context: frontend
          - name: admin
            context: admin
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.name }} image
        run: docker build -t interelia-${{ matrix.name }}:ci ./${{ matrix.context }}

  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-typecheck, admin-typecheck, docker-build]
    steps:
      - name: All checks passed
        run: echo "CI green — Render may auto-deploy (checksPass)"
