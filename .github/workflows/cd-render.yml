# Post-deploy verification + optional force redeploy hooks.
# Primary deploys are Render Blueprint autoDeployTrigger: checksPass (no hooks required).
name: CD Render

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force_hooks:
        description: "Also POST Render Deploy Hooks (needs secrets)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smoke:
    name: Production smoke
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Render rollouts
        run: sleep 90

      - name: Smoke check
        env:
          API_URL: ${{ vars.RENDER_API_URL }}
          STORE_URL: ${{ vars.RENDER_STORE_URL }}
          ADMIN_URL: ${{ vars.RENDER_ADMIN_URL }}
        run: bash scripts/smoke-render.sh

  force-deploy:
    name: Force deploy hooks
    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.force_hooks == true
    runs-on: ubuntu-latest
    steps:
      - name: Trigger API
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
        run: |
          if [ -z "$HOOK" ]; then echo "Skip API — secret not set"; exit 0; fi
          curl -fsS -X POST "$HOOK"
      - name: Trigger store
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_STORE }}
        run: |
          if [ -z "$HOOK" ]; then echo "Skip store — secret not set"; exit 0; fi
          curl -fsS -X POST "$HOOK"
      - name: Trigger admin
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_ADMIN }}
        run: |
          if [ -z "$HOOK" ]; then echo "Skip admin — secret not set"; exit 0; fi
          curl -fsS -X POST "$HOOK"
