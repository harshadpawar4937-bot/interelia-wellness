server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Used when VITE_API_URL is empty (same-origin /api). On Railway, either:
  # - set VITE_API_URL to the public API URL at build time, OR
  # - set API_UPSTREAM to the private API host (e.g. http://api.railway.internal:8000)
  location /api/ {
    proxy_pass ${API_UPSTREAM}/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    proxy_pass ${API_UPSTREAM}/uploads/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass ${API_UPSTREAM}/health;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
