# Railway service: Storefront
# Dashboard: New Service → GitHub repo → Root Directory = frontend
# Set build arg VITE_API_URL to your public API URL (recommended),
# OR leave empty and set runtime API_UPSTREAM to private API host.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
