# Interelia Wellness — production compose
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: interelia-pharmacy-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-interelia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-interelia_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-interelia_pharmacy}
    volumes:
      - interelia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: interelia-pharmacy-redis
    restart: unless-stopped

  api:
    build: ./backend
    container_name: interelia-pharmacy-api
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER:-interelia}:${POSTGRES_PASSWORD:-interelia_change_me}@db:5432/${POSTGRES_DB:-interelia_pharmacy}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:8080,http://127.0.0.1:8080}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.groq.com/openai/v1}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-llama-3.1-8b-instant}
      UPLOAD_DIR: /app/uploads
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
      AI_RATE_LIMIT_PER_MINUTE: ${AI_RATE_LIMIT_PER_MINUTE:-20}
    volumes:
      - interelia_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  storefront:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    container_name: interelia-pharmacy-storefront
    ports:
      - "${STOREFRONT_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  admin:
    build:
      context: ./admin
      args:
        VITE_API_URL: ""
    container_name: interelia-pharmacy-admin
    ports:
      - "${ADMIN_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  interelia_pgdata:
  interelia_uploads:
